# Public Server Profile: direct Caddy HTTPS on a VPS.
#
# Prerequisites:
#   1. APO_PUBLIC_URL is an HTTPS origin whose DNS points to this host.
#   2. Inbound TCP ports 80 and 443 (and optionally UDP 443) are open.
#
# APO_CADDY_SITE_ADDRESS is the public origin; trusted proxies
# default to a non-routable range so direct callers cannot spoof forwarding
# headers.

services:
  frontend:
    environment:
      - NEXTAUTH_URL=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL to https://your-apo-host.example}

  backend:
    environment:
      - APO_DEPLOYMENT_PROFILE=server
      - APO_PUBLIC_URL=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL to https://your-apo-host.example}
      - FRONTEND_URL=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL to https://your-apo-host.example}

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - APO_PUBLIC_URL=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL to https://your-apo-host.example}
      # Direct mode: the Caddy site is the public HTTPS origin.
      - APO_CADDY_SITE_ADDRESS=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL}
      # Keep the shared Caddyfile's optional docs site syntactically valid when
      # the public-docs overlay is absent. The overlay replaces this value.
      - APO_DOCS_HOST=${APO_DOCS_HOST:-apo-docs-disabled.invalid}
      # Host-routed docs/umami site addresses. An enabled host passes its bare
      # hostname (HTTPS on 443, ACME-managed). The disabled defaults compose
      # an explicit http:// address instead: a bare reserved-TLD hostname
      # would also mean automatic HTTPS, with endless ACME retries for a TLD
      # no CA can ever reach. Port 8080 is not published in direct mode, so
      # the disabled blocks stay unreachable.
      - APO_DOCS_SITE_ADDR=${APO_DOCS_SITE_ADDR:-${APO_DOCS_HOST:-http://apo-docs-disabled.invalid:8080}}
      - APO_UMAMI_SITE_ADDR=${APO_UMAMI_SITE_ADDR:-${APO_UMAMI_HOST:-http://umami-disabled.invalid:8080}}
      # Non-routable default so direct callers cannot forge forwarding headers.
      - APO_TRUSTED_PROXY_RANGES=192.0.2.0/24
      - APO_TELEMETRY_MAX_REQUEST_BYTES=${APO_TELEMETRY_MAX_REQUEST_BYTES:-10485760}
      - APO_HTTP_READ_HEADER_TIMEOUT_SECONDS=${APO_HTTP_READ_HEADER_TIMEOUT_SECONDS:-10}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/self-host/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
