# CodSpeed benchmarks — measured speedup/regression reports on PRs.
#
# Two suites run in this single workflow, and CodSpeed aggregates both into one
# report per commit:
#   - backend  : pytest-codspeed over backend/tests/benchmarks
#   - SDK      : vitest bench over packages/sdk/bench
#
# Dual-use with the normal CI suite: the backend files also run in smoke mode
# inside ci.yml's `pytest -x -q`. Here everything runs in CodSpeed's simulation
# mode, which counts CPU instructions so ±% deltas on shared runners are signal
# instead of noise.
#
# Authentication is OIDC — no CODSPEED_TOKEN secret to rotate. The `id-token:
# write` permission on each job is what mints the short-lived credential.
#
# Path-filtered so docs-only PRs don't burn runs.

name: CodSpeed

on:
  push:
    branches: [main]
    paths:
      - "backend/apo/**"
      - "backend/tests/benchmarks/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/apo/**"
      - "backend/tests/benchmarks/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cd backend && uv run pytest tests/benchmarks --codspeed

  sdk:
    name: SDK benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm --filter @apo-ai/sdk bench
