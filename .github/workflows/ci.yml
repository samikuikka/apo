name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Lint + Typecheck (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @apo-ai/sdk
        # The SDK's exports map points external consumers at dist/. Internal dev
        # routes back to src/ via the `development` condition, but the build must
        # still succeed for any external/publish path. This catches build breakage
        # on every PR — previously no CI step built the SDK, which is how the
        # broken `build: tsc` script survived unnoticed.
        run: pnpm --filter @apo-ai/sdk build
      - name: Clean consumer package gate (SDK)
        # The single source of truth for the publish boundary: pack the SDK
        # exactly as a registry release would, install it into a clean
        # directory, import/compile every entry point, and run publint.
        run: pnpm --filter @apo-ai/sdk package:check
      - name: Build @apo-ai/cli
        run: pnpm --filter @apo-ai/cli build
      - name: Test @apo-ai/cli
        # No job ran the CLI's unit suite, so guards on resolution and entry
        # behaviour could only fail on a user's machine. Same selection the
        # publish workflow uses (excludes the long connect scene test).
        run: pnpm --filter @apo-ai/cli test:unit
      - name: Clean consumer package gate (CLI)
        run: pnpm --filter @apo-ai/cli package:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test dashboard
        run: pnpm --filter dashboard test
      - name: Build docs + publication gate
        # Builds the Astro site, publishes versioned schemas, and verifies the
        # publication invariants (no retired origin, every start.md link
        # resolves, Copy Prompt uses the live origin, schema $ids map).
        run: pnpm --filter docs build
      - run: pnpm test:public-ingress
      - name: Public ingress smoke probe contract
        run: pnpm test:public-ingress-smoke
      - name: Public docs deployment contract
        run: pnpm test:public-docs
      - name: Self-adoption docs contract
        run: pnpm test:self-adoption-docs
      - name: External example clean-consumer contract
        run: pnpm test:external-example

  backend:
    name: Typecheck + Test (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Typecheck
        working-directory: backend
        # basedpyright treats warnings as failures whenever GITHUB_ACTIONS is set,
        # even when --level error is requested. Keep the CI and local gates aligned.
        run: env -u GITHUB_ACTIONS uv run basedpyright --level error apo
      - name: Test
        working-directory: backend
        run: uv run pytest -x -q
