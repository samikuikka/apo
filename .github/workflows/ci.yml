name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-probe:
    name: Larger runner probe
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 5
    steps:
      - run: echo "runner: $(uname -m), cores: $(nproc)"
      - run: echo "label ubuntu-latest-8-cores started this job"
