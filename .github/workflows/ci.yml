name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push's run is worthless — cancel it instead of burning the
# full frontend+backend minutes on every rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint + Typecheck (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @apo-ai/sdk
        # The SDK's exports map points external consumers at dist/. Internal dev
        # routes back to src/ via the `development` condition, but the build must
        # still succeed for any external/publish path. This catches build breakage
        # on every PR — previously no CI step built the SDK, which is how the
        # broken `build: tsc` script survived unnoticed.
        run: pnpm --filter @apo-ai/sdk build
      - name: Clean consumer package gate (SDK)
        # The single source of truth for the publish boundary: pack the SDK
        # exactly as a registry release would, install it into a clean
        # directory, import/compile every entry point, and run publint.
        run: pnpm --filter @apo-ai/sdk package:check
      - name: Build @apo-ai/cli
        run: pnpm --filter @apo-ai/cli build
      - name: Test @apo-ai/cli
        # No job ran the CLI's unit suite, so guards on resolution and entry
        # behaviour could only fail on a user's machine. Same selection the
        # publish workflow uses (excludes the long connect scene test).
        run: pnpm --filter @apo-ai/cli test:unit
      - name: Test @apo-ai/sdk
        # 45 test files no workflow executed before the CI-covers-tests
        # invariant; fast (~5s) and self-contained. The command string is
        # load-bearing: tests/test_repo_invariants.py asserts it.
        run: pnpm --filter @apo-ai/sdk test
      - name: Clean consumer package gate (CLI)
        run: pnpm --filter @apo-ai/cli package:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test dashboard
        run: pnpm --filter dashboard test
      - name: Test example-service
        # Vitest suite (16 tests, <1s) no workflow executed before the
        # CI-covers-tests invariant; load-bearing command string.
        run: pnpm --filter @apo/example-service test:run
      - name: Build docs + publication gate
        # Builds the Astro site, publishes versioned schemas, and verifies the
        # publication invariants (no retired origin, every start.md link
        # resolves, Copy Prompt uses the live origin, schema $ids map).
        run: pnpm --filter docs build
      - run: pnpm test:public-ingress
      - name: Public ingress smoke probe contract
        run: pnpm test:public-ingress-smoke
      - name: Public docs deployment contract
        run: pnpm test:public-docs
      - name: Self-adoption docs contract
        run: pnpm test:self-adoption-docs
      - name: External example clean-consumer contract
        run: pnpm test:external-example

  backend:
    name: Typecheck + Test (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The PostgreSQL gates (tests skipped without APO_TEST_POSTGRES_URL): the
    # migration ladder, the v44-v50 rungs, and the execution-lease claim race.
    # The SQLite suite cannot catch a dialect fault in a migration.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: Detect version-only npm release
        id: npm_release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "version_only=$(node scripts/is-version-only-npm-release.mjs "$BASE_SHA" "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: steps.npm_release.outputs.version_only != 'true'
        with:
          version: 11.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.npm_release.outputs.version_only != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.npm_release.outputs.version_only != 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.npm_release.outputs.version_only != 'true'
        with:
          python-version: "3.13"
      - name: Install uv
        if: steps.npm_release.outputs.version_only != 'true'
        # Cached install: the backend + package overlays re-resolve several
        # hundred MB of wheels per run without it.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync dependencies
        if: steps.npm_release.outputs.version_only != 'true'
        working-directory: backend
        run: uv sync --frozen
      - name: Typecheck
        if: steps.npm_release.outputs.version_only != 'true'
        working-directory: backend
        # basedpyright treats warnings as failures whenever GITHUB_ACTIONS is set,
        # even when --level error is requested. Keep the CI and local gates aligned.
        run: env -u GITHUB_ACTIONS uv run basedpyright --level error apo
      - name: Test
        if: steps.npm_release.outputs.version_only != 'true'
        working-directory: backend
        env:
          APO_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -x -q
      - name: Test apo-otel-python package
        if: steps.npm_release.outputs.version_only != 'true'
        # Orphaned suite found by the CI-covers-tests census; pytest is not in
        # the package env, so overlay it. Load-bearing command string.
        working-directory: packages/apo-otel-python
        run: uv run --with pytest pytest -q
      - name: Test langchain-apo package
        if: steps.npm_release.outputs.version_only != 'true'
        # Orphaned suite found by the CI-covers-tests census; langchain-core
        # lives in the package extras, so overlay both. Load-bearing command.
        working-directory: packages/langchain-apo
        run: uv run --with pytest --with langchain-core pytest -q
      - name: Test example-service-py
        if: steps.npm_release.outputs.version_only != 'true'
        # Orphaned suite found by the CI-covers-tests census (12 tests, <1s).
        working-directory: apps/example-service-py
        run: uv run pytest -q
