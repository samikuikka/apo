services:
  frontend:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Local access only. The Server Profile publishes Caddy on 80/443;
      # frontend and backend remain private to the host and Compose network.
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      - BACKEND_URL=http://backend:8000
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      # Gates Settings → System maintenance ops (table stats, reset, nuke).
      # Must match the backend's ADMIN_API_KEY; the backend-proxy turns it
      # into the x-admin-key header so the browser never sees it.
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      # pass the deployment profile to the frontend.
      - APO_DEPLOYMENT_PROFILE=${APO_DEPLOYMENT_PROFILE:-local}
      # Keep NEXTAUTH_URL as a fallback for existing installations; new
      # deployments use APO_PUBLIC_URL as the single public-origin setting.
      - NEXTAUTH_URL=${APO_PUBLIC_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      - APO_PUBLIC_URL=${APO_PUBLIC_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent SQLite database (the file lives at /app/data/apo.db).
      - apo_db:/app/data
    environment:
      # No DATABASE_URL → the supported alpha default is SQLite at
      # /app/data/apo.db. The apo_db volume keeps it across restarts.
      # For a longer-lived shared installation or heavier concurrent writes,
      # apply docker-compose.postgres.yml (see comments there).
      - AUTH_SECRET=${AUTH_SECRET}
      # Must match the frontend's value — see the frontend service note.
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - APO_DEPLOYMENT_PROFILE=${APO_DEPLOYMENT_PROFILE:-local}
      - APO_PUBLIC_URL=${APO_PUBLIC_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      # FRONTEND_URL is the browser-facing URL: used for CORS allow-list and
      # for generating links (password reset, invitations) that the user opens
      # in their browser. It must match NEXTAUTH_URL, NOT the docker-internal
      # hostname, otherwise CORS blocks browser fetches and generated links
      # resolve to unreachable docker-internal addresses.
      - FRONTEND_URL=${APO_PUBLIC_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      # Alpha topology: scheduler runs in the single backend process.
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - APO_ATTEMPT_LEASE_SECONDS=${APO_ATTEMPT_LEASE_SECONDS:-600}
      # Optional first-user bootstrap (idempotent — only runs when no users
      # exist). Normal onboarding is account creation + project invite.
      # Operators set these explicitly when they want headless first boot;
      # unset by default so deploys don't ship with known credentials.
      - INIT_USER_EMAIL=${INIT_USER_EMAIL:-}
      - INIT_USER_PASSWORD=${INIT_USER_PASSWORD:-}
      - INIT_USER_NAME=${INIT_USER_NAME:-}
      # Dev sign-in: one-click "Sign in as dev" button on the login
      # page + agent-demo workspace provisioning. Operator opt-in for this
      # localhost profile; never enable on a publicly reachable deployment.
      - DEV_SIGNIN_ENABLED=${DEV_SIGNIN_ENABLED:-false}
      # --- Data size control (SQLite) ---
      # Age out traces/runs older than N days (0 = disabled, recommended 90).
      - APO_RETENTION_DAYS=${APO_RETENTION_DAYS:-0}
      # Hard ceiling on DB file size in 4 KiB pages (0 = unlimited).
      # e.g. 262144 pages ~= 1 GiB. Writes fail once the cap is hit.
      - APO_MAX_DB_PAGES=${APO_MAX_DB_PAGES:-0}
      # --- Email delivery (optional) ---
      # Unset EMAIL_TRANSPORT_URL keeps the log-only fallback: invitations
      # become copy-link and password-reset links go to the backend logs.
      # Works with any SMTP provider, e.g. Resend:
      #   smtp://resend:API_KEY@smtp.resend.com:587
      - EMAIL_TRANSPORT_URL=${EMAIL_TRANSPORT_URL:-}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-apo}
      # --- LLM provider credentials for task runs ---
      # The backend forwards these into task subprocesses; Compose only passes
      # explicitly listed vars, so without this block setting them in .env is
      # a silent no-op for docker deployments. All optional — unset task runs
      # that call an LLM fail with a clear operator-grade error.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - AGENT_TASK_OPENROUTER_MODEL=${AGENT_TASK_OPENROUTER_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - AGENT_TASK_JUDGE_MODEL=${AGENT_TASK_JUDGE_MODEL:-}
    # NOTE: Single uvicorn worker is intentional. The in-memory rate limiter
    # and SSE broadcaster require a single process. Horizontal scaling needs Redis.
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Schema migrations run to completion before the server starts serving,
      # and the self-hosting docs warn they can take minutes on a multi-GB
      # database. The grace must cover a full upgrade boot — frontend and
      # caddy gate on service_healthy, so a too-short window fails
      # `docker compose up -d` on exactly the upgrades that need it most.
      start_period: 180s

volumes:
  apo_db:
