# Zero-cost Tunnel Trial — Cloudflare Tunnel ingress.
#
# Replaces docker-compose.server.yml for the Tunnel Trial. Caddy listens
# privately on :8080; cloudflared sends traffic from Cloudflare's edge.
# No host ports are published. The same Caddyfile and route contract apply.
#
# Prerequisites:
#   1. A named Cloudflare Tunnel is created with a Published application
#      route: hostname = APO_PUBLIC_URL host, service = http://caddy:8080.
#   2. APO_CLOUDFLARE_TUNNEL_TOKEN is set in the protected environment file.
#
# Start with:
#   scripts/self-host init --profile server --ingress cloudflare-tunnel --public-url https://...
#   scripts/self-host up --build

services:
  frontend:
    environment:
      - NEXTAUTH_URL=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL to https://your-apo-host.example}

  backend:
    environment:
      - APO_DEPLOYMENT_PROFILE=server
      - APO_PUBLIC_URL=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL to https://your-apo-host.example}
      - FRONTEND_URL=${APO_PUBLIC_URL:?Set APO_PUBLIC_URL to https://your-apo-host.example}

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # tunnel mode — Caddy listens privately; no TLS (Cloudflare owns public TLS).
      - APO_CADDY_SITE_ADDRESS=:8080
      # Docs host. Defaults to a reserved, never-resolving TLD (RFC 2606) so the
      # docs site block in the Caddyfile is always valid but matches no traffic
      # when the public-docs overlay is absent. apo-mode tunnel overrides this.
      - APO_DOCS_HOST=${APO_DOCS_HOST:-apo-docs-disabled.invalid}
      # Umami analytics host, same reserved-TLD trick as the docs host. The
      # umami overlay requires a real value; without the overlay this default
      # keeps the Caddyfile block valid but matching no traffic.
      - APO_UMAMI_HOST=${APO_UMAMI_HOST:-umami-disabled.invalid}
      # Host-routed blocks get explicit http addresses so they join caddy's
      # single tunnel listener (:8080). A bare hostname would default to :443,
      # unreachable behind the tunnel where Cloudflare owns public TLS, and
      # certmagic would retry ACME forever for the hostname.
      - APO_DOCS_SITE_ADDR=${APO_DOCS_SITE_ADDR:-http://${APO_DOCS_HOST:-apo-docs-disabled.invalid}:8080}
      - APO_UMAMI_SITE_ADDR=${APO_UMAMI_SITE_ADDR:-http://${APO_UMAMI_HOST:-umami-disabled.invalid}:8080}
      # Trust the private Compose network peer (cloudflared).
      - APO_TRUSTED_PROXY_RANGES=private_ranges
      - APO_TELEMETRY_MAX_REQUEST_BYTES=${APO_TELEMETRY_MAX_REQUEST_BYTES:-10485760}
      - APO_HTTP_READ_HEADER_TIMEOUT_SECONDS=${APO_HTTP_READ_HEADER_TIMEOUT_SECONDS:-10}
    expose:
      - "8080"
    volumes:
      - ./deploy/self-host/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Token-based mode: set APO_CLOUDFLARE_TUNNEL_TOKEN to run via `--token`.
      # Locally-managed mode (the override): leave it unset; the override mounts
      # a credentials.json + config and runs `tunnel run --config`. The token is
      # unused at runtime in that mode, so it defaults to empty here.
      TUNNEL_TOKEN: ${APO_CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      caddy:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
