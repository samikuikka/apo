[project]
name = "apo-backend"
version = "0.3.0"
description = "Backend services for apo"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlmodel",
  "python-dotenv",
  "httpx",
  "psycopg2-binary",
  "bcrypt",
  "python-jose[cryptography]",
  "aiosmtplib>=3.0",
  "opentelemetry-proto>=1.0",
  "opentelemetry-sdk>=1.43.0",
  "opentelemetry-exporter-otlp-proto-http>=1.43.0",
]

[project.optional-dependencies]
# optional S3-compatible ArtifactStore. Install with
# `uv sync --extra s3` (or `pip install apo-backend[s3]`). The default Local
# topology never needs it.
s3 = ["boto3>=1.34"]

[dependency-groups]
dev = [
  "pytest",
  "basedpyright",
  "pyyaml>=6.0.3",
  "pytest-codspeed>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "alpha: internal alpha release gate tests",
]

[tool.uv]
cache-dir = ".uv-cache"
default-groups = ["dev"]
