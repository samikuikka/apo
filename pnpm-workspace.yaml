packages:
  - 'apps/*'
  - 'packages/*'
  - 'backend'
allowBuilds:
  esbuild: true
  msw: true
  # sharp's install script only picks source-vs-prebuilt; when it picks
  # source (global libvips present, or a Node too new for its check) the
  # node-gyp build fails and aborts the whole workspace install (#153),
  # even though the @img prebuilt binary works fine. Skip the script —
  # the prebuild installs as a no-script optional dependency.
  sharp: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@4.1.9'
  - '@vitest/expect@4.1.9'
  - '@vitest/mocker@4.1.9'
  - '@vitest/pretty-format@4.1.9'
  - '@vitest/runner@4.1.9'
  - '@vitest/snapshot@4.1.9'
  - '@vitest/spy@4.1.9'
  - '@vitest/utils@4.1.9'
  - vitest@4.1.9
  - '@vitest/ui@4.1.9'
  - '@opentelemetry/semantic-conventions@1.43.0'
overrides:
  '@apo-ai/cli': link:packages/cli
  '@apo-ai/sdk': link:packages/sdk
